[package]
name = "bitcoin-lottery"
version = "0.1.0"
edition = "2021"
description = "Solo Bitcoin lottery CPU miner (Stratum v1)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
